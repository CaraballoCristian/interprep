<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Interprep — Sin conexión</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #0f172a;
        color: #f8fafc;
        padding: 1.5rem;
      }

      main {
        max-width: 24rem;
        text-align: center;
      }

      .badge {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #94a3b8;
      }

      h1 {
        font-size: 1.5rem;
        margin: 0.75rem 0 0.5rem;
      }

      p {
        color: #cbd5e1;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }

      a {
        display: inline-flex;
        min-height: 3rem;
        align-items: center;
        justify-content: center;
        padding: 0 1.25rem;
        border-radius: 0.75rem;
        background: #38bdf8;
        color: #082f49;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="badge">Interprep</p>
      <h1>Sin conexión / Offline</h1>
      <p>
        Interprep necesita conexión a internet para estudiar y guardar tu
        progreso. / Interprep needs an internet connection to study and save
        your progress.
      </p>
      <a href="/">Reintentar / Retry</a>
    </main>
  </body>
</html>
